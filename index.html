<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0B2545" />

    <!-- Viewport & PWA Capability -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2545" />
    
    <!-- Android / Universal Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS Web App Specific Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nirikshak-AI" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <title>Nirikshak-AI — Legal Metrology Compliance & Inspection Platform</title>
    <meta name="description" content="Official AI-powered inspection & compliance enforcement platform for packaged commodities under the Legal Metrology (Packaged Commodities) Rules, 2011." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Instant Theme Detection Script (Default: Day Mode) -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('nirikshak_theme');
          var isDark = storedTheme === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-institutional-50 dark:bg-[#0B110E] text-institutional-900 dark:text-[#F1F5F3] antialiased font-sans selection:bg-govgreen-100 dark:selection:bg-govgreen-900 selection:text-govgreen-900 dark:selection:text-govgreen-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
